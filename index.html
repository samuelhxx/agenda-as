<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E033C"></head><body style="margin:0;background:#0E033C"><div id="pin-tela" hidden style="position:fixed;inset:0;z-index:50;background:#0E033C;display:grid;place-items:center;padding:24px">
<form id="pin-form" style="display:grid;gap:18px;justify-items:center;text-align:center">
<div style="font-family:'Barlow Condensed',Arial,sans-serif;font-weight:800;font-size:64px;line-height:1;color:#F4F1FA">AS</div>
<label for="pin" style="font-family:'Barlow Semi Condensed',Arial,sans-serif;font-weight:600;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#9AA0B4">Agenda de prospecção · PIN</label>
<input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" style="width:200px;font-size:40px;letter-spacing:.4em;text-align:center;padding:10px;border-radius:10px;border:2px solid #8C2CE1;background:#1C0D52;color:#F4F1FA">
<button type="submit" style="font-family:'Barlow Condensed',Arial,sans-serif;font-weight:800;font-size:24px;text-transform:uppercase;padding:10px 40px;border:none;border-radius:10px;background:#8C2CE1;color:#F4F1FA;cursor:pointer">Entrar</button>
<p id="pin-msg" style="margin:0;min-height:1.4em;color:#B57BF0;font-size:16px"></p>
</form></div>
<title>Agenda de Prospecção AS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: mesma identidade da apresentação AS (fundo roxo-noite, Barlow condensada, roxo vivo).
   Topo = próximo dia em letra grande; faixa de dias clicáveis; pessoas do dia em cartões; trilha da cadência. */
:root{
  --noite:#0E033C; --noite2:#140742; --painel:#1C0D52; --borda:#2E1F6B;
  --roxo:#8C2CE1; --lilas:#B57BF0; --azul:#3FA3FF; --txt:#F4F1FA; --cinza:#9AA0B4;
  --cond:"Barlow Condensed",Arial Narrow,Arial,sans-serif; --semi:"Barlow Semi Condensed",Arial,sans-serif; --body:"Barlow",Arial,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--noite);color:var(--txt)}
body{font-family:var(--body);font-size:17px;line-height:1.4}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin-inline:auto}
.lbl{font-family:var(--semi);font-weight:600;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--cinza);margin:0}
.lbl b{color:var(--lilas);font-weight:600}

/* HERO */
.hero{position:relative;overflow:hidden;padding-block:36px 40px;border-bottom:1px solid var(--borda);
  background:radial-gradient(120% 140% at 100% 0%,#3B0E7A 0%,rgba(14,3,60,0) 55%),var(--noite)}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--roxo)}
.marca{font-family:var(--cond);font-weight:800;font-size:30px;letter-spacing:.02em;line-height:1}
.marca span{font-family:var(--semi);font-weight:600;font-size:13px;letter-spacing:.3em;color:var(--cinza);margin-left:10px;vertical-align:middle}
.hero-grid{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:28px;margin-top:30px}
.dia-grande{font-family:var(--cond);font-weight:800;text-transform:uppercase;line-height:.9;font-size:clamp(64px,13vw,128px);margin:8px 0 0}
.dia-grande em{font-style:normal;color:var(--roxo)}
.nums{display:flex;gap:36px;flex-wrap:wrap}
.num{display:grid;gap:2px}
.num .n{font-family:var(--cond);font-weight:800;font-size:clamp(56px,10vw,96px);line-height:.9;font-variant-numeric:tabular-nums}
.num.li .n{color:var(--lilas)} .num.em .n{color:var(--azul)}
.num .t{font-family:var(--semi);font-weight:600;font-size:16px;letter-spacing:.18em;text-transform:uppercase}

/* ABAS */
.abas{display:flex;gap:8px;margin-top:26px}
.aba{font:inherit;font-family:var(--cond);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em;
  padding:10px 26px;border-radius:10px 10px 0 0;border:2px solid var(--borda);border-bottom:none;background:var(--painel);color:var(--cinza);cursor:pointer}
.aba:focus-visible{outline:3px solid var(--lilas);outline-offset:2px}
.aba[aria-selected="true"]{color:var(--noite)}
.aba.li[aria-selected="true"]{background:var(--lilas);border-color:var(--lilas)}
.aba.em[aria-selected="true"]{background:var(--azul);border-color:var(--azul)}
body.em .num .n,body.em .dia-grande em{color:var(--azul)}
body.em .dia[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:var(--noite)}
body.em .dia[aria-pressed="true"] .sem{color:var(--noite)}
body.em .dia[aria-pressed="true"] .dot{background:var(--noite)}

/* FAIXA DE DIAS */
.dias{padding-block:28px 8px}
.faixa{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 14px;scroll-snap-type:x mandatory}
.dia{flex:0 0 auto;scroll-snap-align:start;min-width:112px;background:var(--painel);border:2px solid var(--borda);border-radius:10px;color:var(--txt);
  padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:6px;font:inherit}
.dia:hover{border-color:var(--lilas)}
.dia:focus-visible{outline:3px solid var(--lilas);outline-offset:2px}
.dia[aria-pressed="true"]{background:var(--roxo);border-color:var(--roxo)}
.dia .sem{font-family:var(--semi);font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--cinza)}
.dia[aria-pressed="true"] .sem{color:var(--txt)}
.dia .dd{font-family:var(--cond);font-weight:800;font-size:38px;line-height:.9}
.dia .cts{display:flex;gap:10px;font-family:var(--semi);font-weight:600;font-size:15px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.li{background:var(--lilas)} .dot.em{background:var(--azul)}
.dia[aria-pressed="true"] .dot.li{background:var(--txt)}

/* PESSOAS DO DIA */
.dia-sel{padding-block:20px 8px}
.canal{margin-top:22px}
.canal h2{font-family:var(--cond);font-weight:800;font-size:40px;text-transform:uppercase;margin:0 0 4px;line-height:1;display:flex;align-items:baseline;gap:12px}
.canal.li h2 .q{color:var(--lilas)} .canal.em h2 .q{color:var(--azul)}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));margin-top:14px}
.card{background:var(--painel);border:1px solid var(--borda);border-radius:10px;padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.card .nome{font-weight:600;font-size:19px;line-height:1.2}
.card .emp{font-family:var(--semi);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cinza)}
.badge{justify-self:start;font-family:var(--semi);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.li .badge{background:rgba(181,123,240,.16);color:var(--lilas)}
.em .badge{background:rgba(63,163,255,.16);color:var(--azul)}
.vazio{color:var(--cinza);font-size:18px;margin-top:16px}

/* TRILHA */
.trilha{padding-block:40px 16px;display:grid;gap:26px}
.linha{display:grid;gap:12px}
.passos{display:flex;align-items:center;flex-wrap:wrap;gap:0}
.passo{display:grid;justify-items:center;gap:6px;min-width:64px}
.passo .c{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:22px;border:2px solid currentColor}
.passo .s{font-family:var(--semi);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza)}
.linha.li{color:var(--lilas)} .linha.em{color:var(--azul)}
.traco{width:26px;height:2px;background:currentColor;opacity:.5;margin-bottom:22px}
.passo.fim .c{background:currentColor;color:var(--noite)}

/* SITUACAO */
.sit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:0;border-top:1px solid var(--borda);margin-top:28px}
.sit div{padding:22px 20px 26px 0;display:grid;gap:4px}
.sit div + div{border-left:1px solid var(--borda);padding-left:20px}
.sit .n{font-family:var(--cond);font-weight:800;font-size:64px;line-height:.9;color:var(--roxo);font-variant-numeric:tabular-nums}
.sit .t{font-family:var(--semi);font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase}
.rod{padding-block:8px 36px;color:var(--cinza);font-size:14px}
@media (prefers-reduced-motion:no-preference){
  .card{animation:sobe .35s ease-out both}
  @keyframes sobe{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
}
</style>

<header class="hero pad"><div class="wrap">
  <div class="marca">AS<span>CONSTRUCTION</span></div>
  <div class="hero-grid">
    <div>
      <p class="lbl" id="hero-lbl">Próximo dia de envio</p>
      <p class="dia-grande" id="hero-dia">—</p>
    </div>
    <div class="nums">
      <div class="num li"><span class="n" id="hero-n">0</span><span class="t" id="hero-t">pessoas</span></div>
    </div>
  </div>
  <div class="abas" role="tablist" aria-label="Canal">
    <button class="aba li" role="tab" id="tab-li" aria-selected="true" type="button">LinkedIn</button>
    <button class="aba em" role="tab" id="tab-em" aria-selected="false" type="button">Gmail</button>
  </div>
</div></header>

<main>
  <section class="dias pad"><div class="wrap">
    <p class="lbl">Escolha o dia</p>
    <div class="faixa" id="faixa" role="group" aria-label="Dias com envio"></div>
  </div></section>

  <section class="dia-sel pad"><div class="wrap" id="sel"></div></section>

  <section class="trilha pad"><div class="wrap" style="display:grid;gap:26px">
    <p class="lbl">A trilha de <b>cada pessoa</b></p>
    <div class="linha li" id="linha-li">
      <div class="passos" id="trilha-li"></div>
    </div>
    <div class="linha em" id="linha-em" hidden>
      <div class="passos" id="trilha-em"></div>
    </div>
    <div class="sit" id="sit"></div>
  </div></section>
  <p class="rod pad"><span class="wrap" style="display:block" id="rod"></span></p>
</main>

    b.appendChild(el('span','sem', d===datas[0]?'próximo':sem(d)));
    b.appendChild(el('span','dd',dd(d)));
    const c=el('span','cts'); const s=el('span'); s.appendChild(el('span','dot '+cls)); s.appendChild(document.createTextNode(dias[d].length)); c.appendChild(s);
    b.appendChild(c);
    b.addEventListener('click',()=>{sel=d; render();});
    f.appendChild(b);
  }
  // pessoas
  const box=document.getElementById('sel'); box.textContent='';
  const arr=(dias[sel]||[]).slice().sort((a,b)=>ordem.indexOf(a.toque)-ordem.indexOf(b.toque)||a.empresa.localeCompare(b.empresa));
  const g={}; for (const x of arr) (g[x.toque]=g[x.toque]||[]).push(x);
  for (const tq of ordem.filter(o=>g[o])){
    const s=el('div','canal '+cls);
    const hh=el('h2'); hh.appendChild(el('span','q',g[tq].length)); hh.appendChild(document.createTextNode(curtoT(tq)));
    s.appendChild(hh);
    const cards=el('div','cards');
    g[tq].forEach((x,i)=>{
      const c=el('div','card'); c.style.animationDelay=Math.min(i*25,400)+'ms';
      c.appendChild(el('span','nome',x.nome)); c.appendChild(el('span','emp',x.empresa));
      cards.appendChild(c);
    });
    s.appendChild(cards); box.appendChild(s);
  }
  if(!arr.length) box.appendChild(el('p','vazio','Nada agendado.'));
}
function fixo(){
  const mk=(id,itens)=>{
    const p=document.getElementById(id);
    itens.forEach(([c,s],i)=>{
      if(i) p.appendChild(el('span','traco'));
      const d=el('div','passo'+(i===itens.length-1?' fim':''));
      d.appendChild(el('span','c',c)); d.appendChild(el('span','s',s)); p.appendChild(d);
    });
  };
  mk('trilha-li',[['A','aceitou'],['2','+3 dias'],['3','+3'],['4','+3'],['5','+3'],['6','+5']]);
  mk('trilha-em',[['1','início'],['2','foto'],['3','+3 dias'],['4','+5']]);
  const s=D.situacao, sit=document.getElementById('sit');
  for (const [k,t] of [['Em cadência','em cadência'],['Convite enviado','convites esperando'],['Aceitou','aceitaram'],['Respondeu','responderam']]){
    const d=el('div'); d.appendChild(el('span','n',s[k]||0)); d.appendChild(el('span','t',t)); sit.appendChild(d);
  }
  document.getElementById('rod').textContent='Atualizado em '+D.gerado+' · nada atrasado';
  document.getElementById('tab-li').addEventListener('click',()=>{canal='LinkedIn'; sel=null; render();});
  document.getElementById('tab-em').addEventListener('click',()=>{canal='E-mail'; sel=null; render();});
}
fixo(); render();
})();
</script>
